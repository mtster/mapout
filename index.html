<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mapout</title>
    <meta name="description" content="A minimalist, dark-themed, ultra-lightweight PWA map and navigation app with route calculation, live turn-by-turn guidance, and destination search." />
    <meta property="og:title" content="Mapout" />
    <meta property="og:description" content="A minimalist, dark-themed, ultra-lightweight PWA map and navigation app with route calculation, live turn-by-turn guidance, and destination search." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png?v=3" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512.png?v=3" />
    
    <!-- PWA & Mobile Web App settings for native iOS & Android feel -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mapout" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons, Touch Icons, and Apple Web Clip configuration for iOS Safari -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        function updateHardwareDimensions() {
          var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
            (navigator.maxTouchPoints > 0 && window.innerWidth <= 1024);
          var h = window.innerHeight || document.documentElement.clientHeight || 0;
          var w = window.innerWidth || document.documentElement.clientWidth || 0;
          if (isMobile) {
            var isLandscape = Math.abs(Number(window.orientation || 0)) === 90 || window.innerWidth > window.innerHeight;
            var rawH = window.screen ? window.screen.height : 0;
            var rawW = window.screen ? window.screen.width : 0;
            var screenH = isLandscape ? Math.min(rawH, rawW) : Math.max(rawH, rawW);
            var screenW = isLandscape ? Math.max(rawH, rawW) : Math.min(rawH, rawW);
            h = Math.max(screenH, window.screen ? window.screen.availHeight || 0 : 0, window.innerHeight || 0, document.documentElement.clientHeight || 0);
            w = Math.max(screenW, window.screen ? window.screen.availWidth || 0 : 0, window.innerWidth || 0, document.documentElement.clientWidth || 0);
          }
          if (h && w) {
            document.documentElement.style.setProperty('--real-screen-height', h + 'px');
            document.documentElement.style.setProperty('--real-screen-width', w + 'px');
          }
        }
        updateHardwareDimensions();
        window.addEventListener('resize', updateHardwareDimensions);
        window.addEventListener('orientationchange', updateHardwareDimensions);
      })();
    </script>
  </head>
  <body class="bg-black text-white m-0 p-0 overflow-hidden select-none touch-manipulation antialiased" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none;">
    <div id="root" class="absolute inset-0 w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
