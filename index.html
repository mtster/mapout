<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mapout</title>
    <meta name="description" content="A minimalist, dark-themed, ultra-lightweight PWA map and navigation app with route calculation, live turn-by-turn guidance, and destination search." />
    
    <!-- PWA & Mobile Web App settings for native iOS & Android feel -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mapout" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile DevTools (Eruda) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
  </head>
  <body class="bg-white text-black m-0 p-0 overflow-hidden select-none touch-manipulation antialiased" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
