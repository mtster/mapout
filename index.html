<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mapout</title>
    <meta name="description" content="A minimalist, dark-themed, ultra-lightweight PWA map and navigation app with route calculation, live turn-by-turn guidance, and destination search." />
    
    <!-- PWA & Mobile Web App settings for native iOS & Android feel -->
    <meta name="theme-color" content="#0c121e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mapout" />
    <meta name="format-detection" content="telephone=no" />
    
    <style>
      :root {
        --app-width: 100vw;
        --app-height: 100vh;
      }
    </style>
    <script>
      function updateViewportDims() {
        // Detect if the app is running as an installed PWA (Standalone)
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        
        // In iOS standalone mode, innerHeight often incorrectly excludes the top/bottom safe areas (e.g. 873px instead of 932px).
        // To guarantee edge-to-edge rendering without gaps, we force the physical screen dimensions.
        if (isStandalone) {
          const isLandscape = window.innerWidth > window.innerHeight;
          const screenW = window.screen.width;
          const screenH = window.screen.height;
          width = isLandscape ? Math.max(screenW, screenH) : Math.min(screenW, screenH);
          height = isLandscape ? Math.min(screenW, screenH) : Math.max(screenW, screenH);
        }
        
        document.documentElement.style.setProperty('--app-width', width + 'px');
        document.documentElement.style.setProperty('--app-height', height + 'px');
      }
      
      // Update dimensions immediately and on resize/orientation changes
      updateViewportDims();
      window.addEventListener('resize', updateViewportDims, { passive: true });
      window.addEventListener('orientationchange', updateViewportDims, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateViewportDims, { passive: true });
      }
    </script>
    
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body class="bg-white text-black m-0 p-0 overflow-hidden select-none touch-manipulation antialiased" style="-webkit-touch-callout: none; -webkit-user-select: none; user-select: none;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
